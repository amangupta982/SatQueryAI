# SatQuery-VQA: Multi-Sensor Adapter Configuration (Sentinel-1 SAR + Sentinel-2 Optical)
# Aligns with RS-InternVL / BigEarthNet.txt Section 4.2 architecture
model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  multisensor_enabled: true
  s2_bands: 12
  s1_channels: 2  # VV, VH
  projector_hidden_dim: 2048

peft:
  method: "lora"
  r: 8
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - "q_proj"
    - "v_proj"

training:
  output_dir: "outputs/satquery-vqa-multisensor"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_ratio: 0.01
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true

data:
  train_data_path: "data/prepared_satquery_vqa/train.json"
  val_data_path: "data/prepared_satquery_vqa/validation.json"
  sensor: "Sentinel-1+2"
