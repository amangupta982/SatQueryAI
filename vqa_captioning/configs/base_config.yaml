# SatQuery-VQA: Base Training Configuration
model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  model_type: "qwen2_5_vl"
  torch_dtype: "bfloat16"
  use_flash_attention_2: false

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "outputs/satquery-vqa"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  gradient_checkpointing: true
  fp16: false
  bf16: true
  dataloader_num_workers: 2

data:
  train_data_path: "data/prepared_satquery_vqa/train.json"
  val_data_path: "data/prepared_satquery_vqa/validation.json"
  benchmark_data_path: "data/prepared_satquery_vqa/benchmark.json"
  max_sequence_length: 1024
  image_resolution: [120, 120]
  sensor: "Sentinel-2"
