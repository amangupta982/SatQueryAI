# SatQuery-VQA: PEFT LoRA Efficient Training Configuration
# Tailored for Apple Silicon MPS and unified memory (16GB RAM)
model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  model_type: "qwen2_5_vl"
  torch_dtype: "float16"

peft:
  method: "lora"
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "models/satquery-vqa"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 25
  eval_steps: 25
  gradient_checkpointing: true
  device: "mps"

data:
  dataset_path: "data/BigEarthNet.txt.parquet"
  processed_dir: "data/processed/satquery_vqa"
  max_sequence_length: 512
  image_resolution: [120, 120]
  sensor: "Sentinel-2"
