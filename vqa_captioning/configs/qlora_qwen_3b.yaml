# SatQuery-VQA: QLoRA 4-bit Efficient Training Configuration
# Tailored for 16GB-24GB GPUs (RTX 3080/4070/4090, A10G, T4)
model:
  base_model: "Qwen/Qwen2.5-VL-3B-Instruct"
  model_type: "qwen2_5_vl"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

peft:
  method: "qlora"
  r: 8
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "outputs/satquery-vqa-qlora"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.001
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 5
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  fp16: false
  bf16: true

data:
  train_data_path: "data/prepared_satquery_vqa/train.json"
  val_data_path: "data/prepared_satquery_vqa/validation.json"
  max_sequence_length: 512
  image_resolution: [120, 120]
  sensor: "Sentinel-2"
